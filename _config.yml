title: United States Travel & Wonder Guide
description: Discover travel-worthy places across all 50 states, Washington, D.C., and the inhabited U.S. territories, from Signature Wonders to places worth traveling for and worth the detour.
url: "https://jeffthomasiii.github.io"
baseurl: "/us-travel-wonder-guide"
markdown: kramdown
permalink: pretty
collections:
  wonders:
    output: true
    permalink: /wonders/:name/
  states:
    output: true
    permalink: /states/:name/
defaults:
  - scope:
      path: ""
      type: wonders
    values:
      layout: wonder
  - scope:
      path: ""
      type: states
    values:
      layout: state
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
