<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/refinements.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/mobile-refinements.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/brand-redesign.css' | relative_url }}">
</head>
<body class="page-{{ page.title | default: 'wander-guy' | slugify }}">
  {% include header.html %}
  <main>{{ content }}</main>
  {% include footer.html %}
  {% include mobile_nav.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
